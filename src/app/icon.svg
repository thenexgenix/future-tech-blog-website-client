<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="#0D0D0D"/>
  
  <!-- 8-burst star icon -->
  <g fill="#FFC700" transform="translate(50,50)">
    <!-- Vertical and Horizontal pills -->
    <rect x="-4" y="-36" width="8" height="20" rx="4" />
    <rect x="-4" y="16" width="8" height="20" rx="4" />
    <rect x="-36" y="-4" width="20" height="8" rx="4" />
    <rect x="16" y="-4" width="20" height="8" rx="4" />
    
    <!-- Diagonal pills (rotated 45 deg) -->
    <g transform="rotate(45)">
      <rect x="-4" y="-36" width="8" height="20" rx="4" />
      <rect x="-4" y="16" width="8" height="20" rx="4" />
      <rect x="-36" y="-4" width="20" height="8" rx="4" />
      <rect x="16" y="-4" width="20" height="8" rx="4" />
    </g>
  </g>
</svg>
